output_dir: ./outputs/deimv2_hgnetv2_pico_coco

DEIM:
  encoder: LiteEncoder
  decoder: DEIMTransformer
  backbone: HGNetv2



HGNetv2:
  name: 'Pico'
  return_idx: [ 2 ]
  freeze_at: -1
  freeze_norm: False
  use_lab: True
  pretrained: False
  use_water_quality: False
  water_fuse_idx: 2
  agg: 'se'  #可以替换后面的创新改进注意力模块：{'CBAM','CAA','CDFA','ECA','GCSA','SSA','LocalAttention','CLAttention','SCSA','CASAtt','LWGA',
               # 'LRSA','KSFA','PolaLinearAttention','LEGA','TSA','FCAttention','ASSA','DualdomainSA','RSA','GSA','CGAttention','DLKA',
               # 'CloAttention','BiLevelRoutingAttention','RCA','ShuffleAttn','SCGA','SAA','VMMAttention','AlternatingAttention',
               #'ConvAtt','HFP','HMHA','MALAttention','GCBAM','MSCA','DynamicSpatialAttention','CSAM','CASAB','MultiScaleAttention','AAFM','IIA',
               #'PATConvAttention','DSPM','RCSSC'永久更新中}

  #addconv: 'StripConv' #可以替换后面的创新改进卷积模块：{'StarConv','ODConv','DSConv','IDConv','DCNv2','CondConv2D','WTConv','PSConv','FFConv','RFAConv',
                   # 'RFCAConv','RFCBAMConv','SCConv','LDConv','DEConv','TBConv','PConv','RepConv','DynamicConv',‘WFEConv'，'GBConv','GSConv',
                   #  'MSGDConv','FADConv','FDConv','ARConv','wConv2D','MBRConv3','MBRConv5','SFSConv','SPConv','MRFAConv',
                   # 'PATConv','StripConv','GCConv','CGHalfConv','HLKConv'永久更新中 }

LiteEncoder:
  in_channels: [512]
  feat_strides: [16]
  use_water_quality: False
  # intra
  hidden_dim: 112

  # cross
  expansion: 0.34
  depth_mult: 0.5
  act: 'silu'


DEIMTransformer:
  feat_channels: [112, 112]
  use_water_quality: True
  feat_strides: [16, 32]
  hidden_dim: 112
  num_levels: 2
  num_points: [4, 2]

  num_layers: 3
  eval_idx: -1
  num_queries: 200

  # FFN
  dim_feedforward: 320

  # New options for DEIMv2
  share_bbox_head: True
  use_gateway: False

# Increase to search for the optimal ema


epoches: 200 # 120 + 4n

## Our LR-Scheduler
flat_epoch: 98    # 4 + epoch // 2, e.g., 40 = 4 + 72 / 2
no_aug_epoch: 12
lr_gamma: 0.5
optimizer: #encoder
  type: AdamW
  params:
    # backbone 普通参数，排除 water，也排除 norm / bn
    -
      params: '^(?=.*backbone)(?!.*water)(?!.*(?:norm|bn)).*$'
      lr: 0.0001

    # backbone norm / bn，排除 water
    -
      params: '^(?=.*backbone)(?!.*water)(?=.*(?:norm|bn)).*$'
      lr: 0.0001
      weight_decay: 0.

    # encoder / decoder 的 norm / bn / bias，排除 water
    -
      params: '^(?:encoder|decoder)\.(?!.*water).*(?:norm|bn|bias).*$'
      lr: 0.0001
      weight_decay: 0.

    # water 普通参数，排除 norm / bn / bias / scale / gamma
    -
      params: '^(?=.*water)(?!.*(?:norm|bn|bias|scale|gamma)).*$'
      lr: 0.0001

    # water 的 norm / bias / scale / gamma 参数
    -
      params: '^(?=.*water)(?=.*(?:norm|bn|bias|scale|gamma)).*$'
      lr: 0.0001
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001
